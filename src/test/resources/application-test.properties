spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Test-only JWT secret. Production has NO fallback (fail-fast on missing
# JWT_SECRET); tests get an explicit throwaway value here so the context
# loads without an env var. Never used outside tests.
jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtbm90LXVzZWQtaW4tcHJvZHVjdGlvbiEh

