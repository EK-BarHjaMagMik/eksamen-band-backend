spring.application.name=eksamen-band-backend

spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/band_db}
spring.datasource.username=${DATABASE_USERNAME:jens}
# No fallback — fail fast if the DB password is not configured (#3).
spring.datasource.password=${DATABASE_PASSWORD}

# update preserves schema+data across restarts. create-drop would wipe the
# database on every container shutdown — fatal with CI auto-redeploys (#1).
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true

# No fallback — the old hardcoded value is leaked in git history and must be
# rotated; fail fast if JWT_SECRET is not configured (#2).
jwt.secret=${JWT_SECRET}

app.upload-dir=${UPLOAD_DIR:uploads}